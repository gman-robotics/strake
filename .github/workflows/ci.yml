name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.83.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.83.0

      - name: Cache cargo
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  verify:
    name: verify-strake skill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.83.0 --profile minimal
          rustup default 1.83.0

      - name: Cache cargo
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: verify-strake end-to-end
        run: .cursor/skills/verify-strake/scripts/verify.sh

  ub-gates:
    name: ub-gates (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: ub-gates script tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.83.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.83.0

      - name: Cache cargo
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Run ub-gates (advisory)
        uses: ./.github/actions/ub-gates
        with:
          advisory: "1"
          base-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          coverage-command: mkdir -p target/coverage/rust && cargo llvm-cov --locked --lcov --output-path target/coverage/rust/lcov.info
          mutator-test-command: cargo test --locked
          rust: "true"
          hub-path: "."
